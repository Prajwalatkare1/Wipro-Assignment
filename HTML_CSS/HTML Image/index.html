<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📸 My Image Gallery</h1>
    <p>A simple responsive gallery website</p>
  </header>

  <main>
    <section class="gallery">
      <figure>
        <img src="images/img1.jpg" alt="Gallery Image 1">
        <figcaption>Image 1</figcaption>
      </figure>
      <figure>
        <img src="images/img2.jpg" alt="Gallery Image 2">
        <figcaption>Image 2</figcaption>
      </figure>
      <figure>
        <img src="images/img3.jpg" alt="Gallery Image 3">
        <figcaption>Image 3</figcaption>
      </figure>
      <figure>
        <img src="images/img4.jpg" alt="Gallery Image 4">
        <figcaption>Image 4</figcaption>
      </figure>
      <figure>
        <img src="images/img5.jpg" alt="Gallery Image 5">
        <figcaption>Image 5</figcaption>
      </figure>
      <figure>
        <img src="images/img6.jpg" alt="Gallery Image 6">
        <figcaption>Image 6</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 My Image Gallery | Built with ❤️ by Prajwal Atkare </p>
  </footer>
</body>
</html>
