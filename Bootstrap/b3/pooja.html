<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Pooja Store</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .topbar {
      background-color: orange;
    }
    .brand-text {
      font-weight: bold;
    }
    .search-btn {
      background: red;
      color: white;
    }
  </style>
</head>
<body>

<nav class="topbar navbar navbar-expand-lg navbar-dark">
  <div class="box-fluid">

    <a class="navbar-brand brand-text" href="#">Online Pooja Store</a>

    <button class="nav-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#navDrop" aria-controls="navDrop" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navDrop">
      <ul class="menu-list navbar-nav me-auto mb-2 mb-lg-0">
        <li class="menu-item">
          <a class="menu-link active" aria-current="page" href="#">Home</a>
        </li>

        <li class="menu-item dropdown">
          <a class="menu-link dropdown-toggle" href="#" id="prodDrop" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Products
          </a>
          <ul class="dropdown-menu" aria-labelledby="prodDrop">
            <li><a class="dropdown-item" href="#">Pooja Kits</a></li>
            <li><a class="dropdown-item" href="#">Idols</a></li>
            <li><a class="dropdown-item" href="#">Flowers</a></li>
            <li><a class="dropdown-item" href="#">Incense Sticks</a></li>
          </ul>
        </li>

        <li class="menu-item">
          <a class="menu-link" href="#">Offers</a>
        </li>
        <li class="menu-item">
          <a class="menu-link" href="#">Cart</a>
        </li>
        <li class="menu-item">
          <a class="menu-link" href="#">Contact Us</a>
        </li>
      </ul>

      <form class="search-box d-flex" role="search">
        <input class="search-input form-control me-2" type="search" placeholder="Search products..." aria-label="Search">
        <button class="search-btn btn" type="submit">Search</button>
      </form>
    </div>
  </div>
</nav>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
