<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tirupati Temple Darshan Booking Form</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
.card {
max-width: 600px;
margin: auto;
}
.temple-logo {
width: 80px;
display: block;
margin: auto;
}
</style>
</head>
<body class="bg-light">

<div class="container py-5">
<div class="card shadow p-4 rounded">
<!-- Logo -->
<img src="https://th.bing.com/th/id/OIP.gL_y-IhAyKLq2ekqyn6XBQHaHa?w=191&h=180&c=7&r=0&o=5&dpr=1.3&pid=1.7" alt="Temple Logo" class="temple-logo mb-3">

<!-- Title -->
<h3 class="text-center mb-4">Tirupati Temple Darshan Booking Form</h3>

<!-- Form Start -->
<form id="bookingForm" novalidate>

<!-- Full Name -->
<div class="mb-3">
<label class="form-label">Full Name</label>
<input type="text" class="form-control" required>
<div class="invalid-feedback">Please enter your full name.</div>
</div>

<!-- Email -->
<div class="mb-3 form-floating">
<input type="email" class="form-control" id="email" placeholder="name@example.com" required>
<label for="email">Email Address</label>
<div class="invalid-feedback">Please enter a valid email.</div>
</div>

<!-- Mobile -->
<div class="mb-3">
<label class="form-label">Mobile Number</label>
<div class="input-group">
<span class="input-group-text">+91</span>
<input type="tel" class="form-control" pattern="[0-9]{10}" required>
<div class="invalid-feedback">Enter a valid 10-digit number.</div>
</div>
</div>

<!-- Gender -->
<div class="mb-3">
<label class="form-label">Gender</label><br>
<div class="form-check form-check-inline">
<input class="form-check-input" type="radio" name="gender" required>
<label class="form-check-label">Male</label>
</div>
<div class="form-check form-check-inline">
<input class="form-check-input" type="radio" name="gender">
<label class="form-check-label">Female</label>
</div>
<div class="form-check form-check-inline">
<input class="form-check-input" type="radio" name="gender">
<label class="form-check-label">Other</label>
</div>
</div>

<!-- Date & Time -->
<div class="row g-3 mb-3">
<div class="col-md-6">
<label class="form-label">Darshan Date</label>
<input type="date" class="form-control" required>
</div>
<div class="col-md-6">
<label class="form-label">Darshan Time Slot</label>
<select class="form-select" required>
<option value="">Choose...</option>
<option>Morning</option>
<option>Afternoon</option>
<option>Evening</option>
</select>
</div>
</div>

<!-- Tickets -->
<div class="mb-3">
<label class="form-label">Number of Tickets</label>
<input type="number" class="form-control" min="1" max="10" required>
</div>

<!-- Seva Type -->
<div class="mb-3">
<label class="form-label">Seva Type</label><br>
<div class="form-check form-check-inline">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">Archana</label>
</div>
<div class="form-check form-check-inline">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">Abhishekam</label>
</div>
<div class="form-check form-check-inline">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">Special Entry Darshan</label>
</div>
<div class="form-check form-check-inline">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">Suprabhata Seva</label>
</div>
</div>

<!-- ID Proof -->
<div class="mb-3">
<label class="form-label">ID Proof Upload 
<span data-bs-toggle="tooltip" title="Accepted formats: JPG, PNG, PDF. Max size: 2MB">
<i class="bi bi-info-circle"></i>
</span>
</label>
<input type="file" class="form-control" accept=".jpg,.png,.pdf" required>
</div>

<!-- Address -->
<div class="mb-3">
<label class="form-label">Address</label>
<textarea class="form-control" rows="2" required></textarea>
</div>

<!-- Buttons -->
<div class="d-grid gap-2">
<button type="submit" class="btn btn-primary">Submit</button>
<button type="reset" class="btn btn-secondary">Reset</button>
</div>
</form>
</div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Form Validation -->
<script>
(() => {
'use strict'
const forms = document.querySelectorAll('form')
Array.from(forms).forEach(form => {
form.addEventListener('submit', event => {
if (!form.checkValidity()) {
event.preventDefault()
event.stopPropagation()
}
form.classList.add('was-validated')
}, false)
})
})();
</script>

</body>
</html>
