<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Customer Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Bank Customer Management</h1>
            <p class="subtitle">Dynamic Array Operations Demo</p>
        </header>

        <main>
            <div class="control-panel">
                <button id="initBtn">Initialize Customers</button>
                <button id="addBtn">Add Customer</button>
                <button id="removeBtn">Remove Customer</button>
                <button id="insertBtn">Insert Customer</button>
            </div>

            <div class="customer-operations">
                <div class="customer-list">
                    <h2>Customer List</h2>
                    <div id="customerDisplay" class="customer-display"></div>
                </div>

                <div class="operation-history">
                    <h2>Operation Log</h2>
                    <div id="operationLog" class="log-display"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
