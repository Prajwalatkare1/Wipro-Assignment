<!DOCTYPE html>
<html>
<head>
    <title>Tour Booking Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f9f9f9;
        }
        h2 {
            color: #333;
        }
        form {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        input, select, button {
            margin-top: 5px;
            padding: 8px;
            width: 100%;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            background: #28a745;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        button:hover {
            background: #218838;
        }
        #summary {
            margin-top: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <h2>Tour Booking Form</h2>
    <form id="bookingForm" onsubmit="calculateBooking(event)">
        <label for="name">Full Name:</label>
        <input type="text" id="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" required>

        <label for="destination">Destination:</label>
        <select id="destination" required>
            <option value="">--Select--</option>
            <option value="Ooty">Ooty</option>
            <option value="Goa">Goa</option>
            <option value="Manali">Manali</option>
        </select>

        <label for="days">Number of Days:</label>
        <input type="number" id="days" min="1" required>

        <label for="travelers">Number of Travelers:</label>
        <input type="number" id="travelers" min="1" required>

        <button type="submit">Book Now</button>
    </form>

    <div id="summary"></div>

    <script>
        function calculateBooking(event) {
            event.preventDefault(); // Prevent form refresh

            // Get form values
            var name = document.getElementById("name").value;
            var email = document.getElementById("email").value;
            var destination = document.getElementById("destination").value;
            var days = parseInt(document.getElementById("days").value);
            var travelers = parseInt(document.getElementById("travelers").value);

            // Price per day per person
            var pricePerDay = 0;
            if (destination === "Ooty") {
                pricePerDay = 2000;
            } else if (destination === "Goa") {
                pricePerDay = 3000;
            } else if (destination === "Manali") {
                pricePerDay = 4000;
            }

            // Calculate total cost
            var totalCost = pricePerDay * days * travelers;

            // Display booking summary
            document.getElementById("summary").innerHTML = `
                <h3>Booking Summary</h3>
                <p><strong>Name:</strong> ${name}</p>
                <p><strong>Email:</strong> ${email}</p>
                <p><strong>Destination:</strong> ${destination}</p>
                <p><strong>Days:</strong> ${days}</p>
                <p><strong>Travelers:</strong> ${travelers}</p>
                <p><strong>Total Cost:</strong> ₹${totalCost.toLocaleString()}</p>
            `;
        }
    </script>

</body>
</html>
